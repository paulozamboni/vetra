services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vetra
      POSTGRES_USER: vetra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vetra -d vetra]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vetra:${POSTGRES_PASSWORD}@postgres:5432/vetra
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py setup_roles && gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2"]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vetra:${POSTGRES_PASSWORD}@postgres:5432/vetra
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [celery, -A, config, worker, --loglevel=info]
volumes:
  postgres_data:
  redis_data:
